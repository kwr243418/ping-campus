# 알림 A·B 발송: 10분마다 /api/cron/notify 호출
# 저장소 Settings → Secrets and variables → Actions 에 APP_URL(예: https://ping-campus.vercel.app), CRON_SECRET 등록
name: cron-notify
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call notify cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET 미설정 — 건너뜀"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/notify"
